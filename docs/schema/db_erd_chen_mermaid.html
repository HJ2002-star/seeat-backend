<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>수산물 거래 플랫폼 - 통합 ERD (Peter Chen 표기법)</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #ffffff;
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;

  .legend { font-size: 12px; color: #5F5E5A; margin-bottom: 16px; }

</style>

<body>
<h1>수산물 거래 플랫폼 — 통합 ERD (Peter Chen 표기법)</h1>
<p class="sub">디자인 초기안 v1.0 반영 · 20개 테이블(사각형) · 기본키 속성(타원) · 관계(마름모) · 27개 관계</p>
<div class="legend">

  <span><i class="swatch" style="background:#FDF3D9;border:1px solid #854F0B"></i>관계(마름모)</span>
  <span><i class="swatch" style="background:#F8F7F3;border:1px solid #A5A399"></i>기본키 속성(타원)</span>
</div>
<div id="erd"></div>
