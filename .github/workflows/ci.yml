name: CI

# main 브랜치로 push되거나 main을 대상으로 PR이 열릴 때마다
# 자동으로 빌드 + 테스트를 실행합니다. (배포는 포함하지 않음 - CD는 별도)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      # 위성훈님 PDF 기준 Spring Boot 3.3.2 + Gradle 8.8.
      # Java 버전은 build.gradle의 sourceCompatibility 확인해서 맞춰야 함 (일단 17로 설정, 다르면 수정 필요)
      - name: JDK 17 설치
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'   # gradle 의존성 캐싱으로 빌드 속도 향상

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 빌드 및 테스트
        run: ./gradlew build
        env:
          SPRING_PROFILES_ACTIVE: test
